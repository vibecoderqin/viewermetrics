name: Sync source and publish installable ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viewer-metrics-source-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Import the complete public upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/viewermetrics/viewermetrics.git /tmp/viewermetrics-upstream
          rsync -a --exclude='.git/' --exclude='.github/' \
            --exclude='README.md' --exclude='LICENSE' \
            --exclude='PRIVACY_POLICY.md' --exclude='CHANGELOG.md' \
            /tmp/viewermetrics-upstream/ ./

      - name: Validate extension files
        shell: bash
        run: |
          set -euo pipefail
          node -e "const m=require('./manifest.json'); if (m.manifest_version !== 3) process.exit(1)"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const missing = [];
          for (const entry of (m.content_scripts || [])) {
            for (const f of [...(entry.js || []), ...(entry.css || [])]) {
              if (!fs.existsSync(f)) missing.push(f);
            }
          }
          if (missing.length) {
            console.error('Missing manifest files:', missing);
            process.exit(1);
          }
          NODE
          while IFS= read -r -d '' file; do
            case "$file" in
              lib/*) continue ;;
            esac
            node --check "$file"
          done < <(find background content pages shared -type f -name '*.js' -print0)

      - name: Commit the full source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish Viewer Metrics 0.9.951 source"
            git push origin HEAD:main
          fi

      - name: Package installable source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr /tmp/viewermetrics-0.9.951-source.zip . \
            -x '.git/*' '.github/*' '**/.DS_Store'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.9.951 >/dev/null 2>&1; then
            gh release upload v0.9.951 /tmp/viewermetrics-0.9.951-source.zip --clobber
          else
            gh release create v0.9.951 /tmp/viewermetrics-0.9.951-source.zip \
              --target main \
              --title "Viewer Metrics 0.9.951 — source snapshot" \
              --notes "Complete installable source snapshot synced from https://github.com/viewermetrics/viewermetrics. This is version 0.9.951; it is not the separate local 0.9.953 hardened archive."
          fi
